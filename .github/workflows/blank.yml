let jarvisRunning = false;
let userVerified = false;

// ---------- START JARVIS ----------

function startJarvis() {

    showStatus("INITIALIZING JARVIS OS...");

    setTimeout(function () {

        showStatus("VERIFYING USER...");

        verifyFace();

    }, 1000);
}


// ---------- FACE VERIFICATION ----------

function verifyFace() {

    // Replace this with AppStudio's camera/face-recognition
    // functionality when you add it.

    userVerified = true;

    if (userVerified) {

        showStatus("USER VERIFIED");

        speak("Welcome. JARVIS OS version 2 is ready.");

        setTimeout(function () {
            startListening();
        }, 1500);

    } else {

        showStatus("ACCESS DENIED");

        speak("Face verification failed.");

    }
}


// ---------- VOICE SYSTEM ----------

function startListening() {

    if (!userVerified) {
        speak("User verification required.");
        return;
    }

    jarvisRunning = true;

    showStatus("LISTENING...");

    // Connect this function to AppStudio's
    // speech-recognition component.

    startSpeechRecognition();

}


// ---------- SPEECH RECOGNITION ----------

function startSpeechRecognition() {

    /*
       AppStudio speech-recognition component
       should call:

       processCommand(result);

       when speech is converted to text.
    */

}


// ---------- COMMAND PROCESSOR ----------

function processCommand(command) {

    if (!command) {
        startListening();
        return;
    }

    command = command.toLowerCase().trim();

    showCommand(command);


    // ---------- GREETING ----------

    if (command.includes("hello") ||
        command.includes("hi jarvis")) {

        speak("Hello. I am ready.");

    }


    // ---------- TIME ----------

    else if (command.includes("time")) {

        let now = new Date();

        let time = now.toLocaleTimeString();

        speak("The current time is " + time);

    }


    // ---------- OPEN CAMERA ----------

    else if (command.includes("open camera")) {

        speak("Opening camera.");

        openCamera();

    }


    // ---------- OPEN SETTINGS ----------

    else if (command.includes("open settings")) {

        speak("Opening settings.");

        openSettings();

    }


    // ---------- SEARCH ----------

    else if (command.startsWith("search")) {

        let query =
            command.replace("search", "").trim();

        if (query.length > 0) {

            speak("Searching for " + query);

            searchWeb(query);

        } else {

            speak("What should I search for?");

        }

    }


    // ---------- STOP ----------

    else if (command.includes("stop jarvis") ||
             command.includes("shutdown jarvis")) {

        speak("JARVIS OS is going offline.");

        jarvisRunning = false;

        showStatus("OFFLINE");

        return;

    }


    // ---------- HELP ----------

    else if (command.includes("help")) {

        speak(
            "You can ask me to open the camera, " +
            "open settings, tell the time, " +
            "or search the web."
        );

    }


    // ---------- UNKNOWN COMMAND ----------

    else {

        speak(
            "I don't understand that command yet."
        );

    }


    // Continue listening

    if (jarvisRunning) {

        setTimeout(function () {

            startListening();

        }, 1000);

    }
}


